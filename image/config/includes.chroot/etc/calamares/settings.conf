# DolphinOS 安装程序（Calamares）总配置，Alpha 11 起自研安装页退役、
# 改用 Calamares（用户 2026-11-19 定案）。格式与键名按 Debian sid 的
# Calamares 3.4 与 calamares-settings-debian 的现行写法对齐。
---
modules-search: [ local ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false

instances:
    - id: finalize
      module: shellprocess

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - hwclock
        - networkcfg
        - users
        - removeuser
        - shellprocess@finalize
        - initramfs
        - bootloader
        - umount
    - show:
        - finished

branding: dolphin

prompt-install: false
dont-chroot: false
