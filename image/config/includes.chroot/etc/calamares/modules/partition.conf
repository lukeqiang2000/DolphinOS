# 分区页：整盘擦除（自动）与手动分区都可用（分区页自带两种模式）。
# 键名按 Calamares 3.4 的 partition.conf 现行格式（参照
# calamares-settings-debian 同名文件）。
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "ESP"

userSwapChoices:
    - none
    - small
    - suspend
    - file

luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialSwapChoice: none
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs", "f2fs", "ntfs", "fat32" ]

# 不要动 Live 介质本身的挂载（与 Debian 设置同款保护）。
essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
    enable: false
