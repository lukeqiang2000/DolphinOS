# DolphinOS 默认 Plymouth 配置：开机动画用自研 dolphin 主题
# （two-step 插件实现，见主题目录里的说明）。initramfs 收录哪套主题
# 由 plymouth 的 initramfs hook 按本文件的 Theme= 决定（它运行
# plymouth-set-default-theme 取名，再按 ModuleName 拷插件与主题），
# 0100-plymouth-theme.hook.chroot 在 chroot 阶段兜底校验并重建
# initramfs。本文件同时保证真实系统运行时 plymouthd 也选 dolphin。
[Daemon]
Theme=dolphin
ShowDelay=0
