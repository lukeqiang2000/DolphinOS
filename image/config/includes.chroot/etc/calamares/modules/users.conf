# 用户页：建正式用户（进 sudo 组）、不设 root 密码（与 DolphinOS 旧
# 安装引擎口径一致：装好后用该用户登录，OOBE 在首次登录时再弹）。
# 密码下限 4 位，沿用旧安装页的校验口径。
---
userGroup: users
defaultGroups:
    - users
    - adm
    - cdrom
    - sudo
    - audio
    - video
    - plugdev
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false
doAutologin: false

passwordRequirements:
    nonempty: true
    minLength: 4
    maxLength: -1

userShell: /bin/bash
