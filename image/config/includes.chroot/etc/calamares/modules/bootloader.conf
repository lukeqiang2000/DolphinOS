# 引导：GRUB 2，BIOS（i386-pc）与 UEFI（x86_64-efi）由模块按固件自动选。
# installEFIFallback=true：同时写 ESP 的 fallback 路径
# EFI/BOOT/BOOTX64.EFI，不依赖 NVRAM 启动项（虚拟机/换盘场景可直接启动，
# 与旧自研引擎的 --removable 口径一致）。
# /etc/default/grub 的内容（菜单隐藏、quiet splash 等）由 finalize 步骤
# 在本模块跑 grub-mkconfig 之前写好。
---
efiBootLoader: "grub"
efiBootloaderId: "DolphinOS"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
