source /boot/grub/config.cfg

# DolphinOS 启动条目（实际条目由 live-build 在构建时注入到此处，
# 条目标签的品牌化由 config/hooks/live/0010-grub-branding.hook.binary 完成）
@LINUX_LIVE@

# 安装器（当前构建未启用 debian-installer，此块会被替换为 if false）
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu '高级安装选项 ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu '工具...' --hotkey=u {

	source /boot/grub/theme.cfg

	# 内存测试（若有）
	if @ENABLE_MEMTEST@; then
	source /boot/grub/memtest.cfg
	fi

	# 固件设置（UEFI）
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI 固件设置" --hotkey=f {
			fwsetup
		}
	fi

	# 校验启动介质完整性
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "校验启动介质完整性" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
