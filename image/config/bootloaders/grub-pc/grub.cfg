source /boot/grub/config.cfg

# DolphinOS (Alpha 9): boot straight into the default entry, no menu.
# timeout_style=hidden hides the menu during the countdown; timeout=1
# leaves a one-second window to hold Shift (BIOS) or Esc (UEFI) to bring
# the menu back, then boots automatically.
set timeout_style=hidden
set timeout=1

# DolphinOS boot entries (live-build injects the actual entries here;
# their branding is done by config/hooks/live/0010-grub-branding.hook.binary)
@LINUX_LIVE@

# Installer (debian-installer is not enabled in the current build;
# this block is replaced with `if false`)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memory test (if present)
	if @ENABLE_MEMTEST@; then
	source /boot/grub/memtest.cfg
	fi

	# Firmware settings (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify boot medium integrity
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify boot medium integrity" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
